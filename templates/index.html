<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ece5dd;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-wrapper {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-display {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #dcf8c6;
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .bot-msg {
            background-color: #ffffff;
            color: #000;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .interactive-area {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
            gap: 10px;
        }
        .interactive-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
        }
        .interactive-area button {
            background-color: #128c7e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .interactive-area button:hover {
            background-color: #075e54;
        }
    </style>
</head>
<body>

    <div class="chat-wrapper">
        <div class="chat-header">Support Chat</div>
        <div class="chat-display" id="chat-display">
            <div class="msg bot-msg">Hello! Welcome to Customer Support. How can I assist you today?</div>
        </div>
        <div class="interactive-area">
            <input type="text" id="user-query" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
            <button onclick="handleSend()">&#10148;</button>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                handleSend();
            }
        }

        function handleSend() {
            const inputElement = document.getElementById("user-query");
            const queryText = inputElement.value.trim();
            if (!queryText) return;

            renderMessage(queryText, "user-msg");
            inputElement.value = "";

            fetch("/get_response", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: queryText })
            })
            .then(response => response.json())
            .then(data => {
                renderMessage(data.response, "bot-msg");
            });
        }

        function renderMessage(text, className) {
            const displayZone = document.getElementById("chat-display");
            const element = document.createElement("div");
            element.className = `msg ${className}`;
            element.innerText = text;
            displayZone.appendChild(element);
            displayZone.scrollTop = displayZone.scrollHeight;
        }
    </script>

</body>
</html>
